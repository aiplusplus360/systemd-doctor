[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemd-doctor"
version = "0.1.0"
description = "Audit systemd units for missing hardening and restart storms."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []
keywords = ["systemd", "hardening", "linux", "security", "devops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/aiplusplus360/systemd-doctor"

[project.scripts]
systemd-doctor = "systemddoctor.cli:main"

[tool.setuptools.packages.find]
include = ["systemddoctor*"]
